services:
  creatorflow:
    build: .
    container_name: creatorflow-app
    restart: always
    network_mode: host
    env_file:
      - .env.production
    environment:
      - NEXT_PUBLIC_ADMIN_EMAIL=${ADMIN_EMAIL:-marcosvlogs12@gmail.com}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    volumes:
      - video-uploads:/data/videos
      - stock-uploads:/data/stock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(r.ok)process.exit(0);process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  video-uploads:
  stock-uploads:
